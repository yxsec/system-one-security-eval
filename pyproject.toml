[project]
name = "system-one-security-eval"
version = "0.1.0"
description = "Offline security-decision experiments and final result analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "huggingface-hub>=0.34,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
local = ["torch>=2.6", "transformers>=5,<6", "sentencepiece>=0.2", "protobuf>=5"]
apple = ["mlx==0.32.2; sys_platform == 'darwin'", "mlx-lm==0.31.3; sys_platform == 'darwin'", "peft>=0.18,<1", "accelerate>=1.9,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
security-eval = "security_eval.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
exclude = ["external", "data", "models", "runs"]
